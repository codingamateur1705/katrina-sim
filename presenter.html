<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katrina Simulation · Presenter</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F5F35'/%3E%3Cpath d='M16 6a10 10 0 1 0 10 10' stroke='white' stroke-width='3' fill='none'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
<style>
:root{--g:#0E883F;--dg:#1F5F35;--b:#F1ECE2;--r:#9B2328;--t:#1E1E1E;--gr:#696969;--font:"Gill Sans","Gill Sans Nova","Gill Sans MT",Calibri,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;color:var(--t);font-family:var(--font);overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.slide{position:relative;width:100vw;height:100vh;overflow:hidden;background:#fff;cursor:pointer;user-select:none}
.bg{position:absolute;inset:0;background:#222 center/cover no-repeat}
.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.86) 0%,rgba(0,0,0,.62) 48%,rgba(0,0,0,.15) 100%)}
.content{position:absolute;inset:0;padding:5.5vh 6vw;display:flex;flex-direction:column;justify-content:center;color:#fff}
.eyebrow{font-size:clamp(14px,1.6vw,26px);letter-spacing:.1em;text-transform:uppercase;color:#9FD7B0;font-weight:700}
h1{font-size:clamp(34px,4.6vw,78px);line-height:1.06;margin:.25em 0 .4em;max-width:62vw}
h2{font-size:clamp(28px,3.4vw,58px);line-height:1.1;margin:.2em 0 .5em;max-width:60vw}
.box{background:rgba(255,255,255,.1);border-left:6px solid var(--g);padding:2.2vh 2vw;max-width:56vw;border-radius:4px}
.box.red{border-left-color:#e05a60}
.box h3{margin:0 0 1.2vh;font-size:clamp(14px,1.5vw,24px);letter-spacing:.1em;text-transform:uppercase;color:#cfe9d7}
.box.red h3{color:#f3c1c3}
.box ul{margin:0;padding-left:1.1em;font-size:clamp(20px,2.3vw,40px);line-height:1.3}
.box li{margin:.25em 0}
.credit{position:absolute;right:1.2vw;bottom:1vh;font-size:clamp(10px,.85vw,14px);color:rgba(255,255,255,.75);z-index:3}
.credit.dark{color:#777}
.timer{position:absolute;right:4vw;top:5vh;z-index:4;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:1.2vh 1.6vw;font-size:clamp(22px,2.6vw,46px);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.timer.low{border-color:#e05a60;color:#ffb3b6}
.timer small{display:block;font-size:.38em;font-weight:400;letter-spacing:.06em;text-transform:uppercase;opacity:.8;text-align:center}
/* title */
.title{background:var(--b);color:var(--t)}
.title .content{color:var(--t);flex-direction:row;align-items:center;gap:4vw}
.title .l{flex:1.3}
.title h1{color:var(--t);max-width:none}
.title .eyebrow{color:var(--g)}
.title p{font-size:clamp(18px,1.9vw,32px);margin:0 0 3vh;color:#333}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}
.seat{color:#fff;border-radius:6px;padding:1.6vh 1.2vw}
.seat small{display:block;font-size:clamp(11px,1vw,17px);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.seat b{display:block;font-size:clamp(17px,1.8vw,30px)}
.seat span{font-size:clamp(13px,1.2vw,20px);opacity:.92}
.qr{flex:.8;text-align:center}
.qr img{width:min(32vw,58vh);background:#fff;padding:1vw;border-radius:8px;image-rendering:pixelated}
.qr div{font-size:clamp(14px,1.4vw,24px);font-weight:700;margin-top:1.5vh;word-break:break-all;color:var(--dg)}
/* table */
.tab{background:#fff;color:var(--t)}
.tab .content{color:var(--t);justify-content:flex-start;padding-top:5vh}
.tab h2{color:var(--t);max-width:none;margin-bottom:2.5vh}
table{border-collapse:separate;border-spacing:.5vw;width:100%;table-layout:fixed}
th{font-size:clamp(12px,1.25vw,21px);text-align:left;color:var(--gr);letter-spacing:.05em;text-transform:uppercase;padding:0 .6vw}
td{background:var(--b);font-size:clamp(13px,1.45vw,25px);line-height:1.25;padding:1.4vh .9vw;vertical-align:top;border-radius:4px}
td.who{color:#fff;font-weight:700}
td.who small{display:block;font-weight:400;font-size:.75em;opacity:.9}
.src{font-size:clamp(10px,.95vw,16px);color:var(--gr);margin-top:2vh;line-height:1.35}
/* closing */
.close{background:var(--r)}
.close .content{align-items:center;text-align:center}
.close h1{max-width:80vw;font-size:clamp(34px,4.4vw,74px)}
.close .src{color:rgba(255,255,255,.8);max-width:80vw}
/* chrome */
#bar{position:fixed;left:0;bottom:0;height:5px;background:var(--g);z-index:10;transition:width .2s}
#ctl{position:fixed;left:1vw;bottom:1.2vh;z-index:11;display:flex;gap:6px;opacity:.25;transition:opacity .2s}
#ctl:hover{opacity:1}
#ctl button{background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
#notes{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#fffbe6;color:#333;padding:14px 22px 22px;font-size:17px;border-top:3px solid #c9a300;display:none;max-height:40vh;overflow:auto}
#notes.on{display:block}
#notes b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8a6d00;margin-bottom:4px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div id="ctl"><button id="c-prev" aria-label="Previous">‹</button><button id="c-next" aria-label="Next">›</button><button id="c-notes">Notes (N)</button><button id="c-full">Full screen (F)</button></div>
<div id="notes"></div>
<script src="data.js"></script>
<script src="js/presenter.js"></script>
</body>
</html>
